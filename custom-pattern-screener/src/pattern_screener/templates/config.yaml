# 数据源配置示例
# 复制为 config/config.yaml 后按需修改；
# 也可直接用环境变量 TDX_ROOT / CACHE_DIR / PREFER_LOCAL 覆盖。

tdx:
  # 通达信安装目录（需包含 vipdoc/ 子目录，含日线数据）
  # 留空则纯在线模式（akshare，需联网）
  root_dir: ""

data:
  prefer_local: true          # 优先本地 TDX，失败自动回退 akshare
  cache_dir: "data/cache"     # Parquet 缓存目录（相对项目根目录）
  cache_ttl:
    daily: 1                  # 日线缓存有效期（天）
